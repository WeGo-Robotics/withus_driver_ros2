/**:
  ros__parameters:
    base_frame_id: base_link
    command_timeout_ms: 200
    body_command_timeout_ms: 500
    control_request_timeout_ms: 1000
    stop_timeout_ms: 3000
    # Hardware mode profiles use this full request=0 release interval.
    release_timeout_ms: 1000
    stop_confirm_duration_ms: 200
    max_command_age_ms: 200
    future_stamp_tolerance_ms: 50
    # Actuator limits/brake below apply only to vcan_reference; mode-only sends 0x501.
    max_forward_speed_mps: 1.0
    max_reverse_speed_mps: 0.5
    max_steering_angle_rad: 0.3
    stop_brake_percent: 25.0
    # Used by vcan_reference, hardware_mode_only and stationary brake testing.
    stop_speed_threshold_mps: 0.05
    # hardware_brake_test: bounded stationary 0x503 experiments only.
    brake_test_max_duration_ms: 2000
    brake_test_release_duration_ms: 1000
    brake_test_max_percent: 100.0
